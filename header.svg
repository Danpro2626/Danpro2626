<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Main gradient: deep navy to dark navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0a1628"/>
      <stop offset="45%"  stop-color="#0f2044"/>
      <stop offset="100%" stop-color="#071020"/>
    </linearGradient>
    <!-- Gold shimmer gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#b8860b"/>
      <stop offset="30%"  stop-color="#ffd700"/>
      <stop offset="55%"  stop-color="#fffacd"/>
      <stop offset="75%"  stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <!-- Gold for text -->
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#c9a84c"/>
      <stop offset="40%"  stop-color="#ffd700"/>
      <stop offset="60%"  stop-color="#fff8dc"/>
      <stop offset="100%" stop-color="#c9a84c"/>
    </linearGradient>
    <!-- Subtle glow behind name -->
    <radialGradient id="glowBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#1a3a6e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0a1628" stop-opacity="0"/>
    </radialGradient>
    <!-- Code text fade -->
    <linearGradient id="codeFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0a1628"/>
      <stop offset="12%"  stop-color="#0a1628" stop-opacity="0"/>
      <stop offset="88%"  stop-color="#0a1628" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="codeFadeV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#0a1628"/>
      <stop offset="15%"  stop-color="#0a1628" stop-opacity="0"/>
      <stop offset="85%"  stop-color="#0a1628" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <!-- Bottom wave clip -->
    <clipPath id="waveClip">
      <path d="M0,0 L900,0 L900,185 Q675,200 450,185 Q225,170 0,185 Z"/>
    </clipPath>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- BG -->
  <rect width="900" height="200" fill="url(#bgGrad)" clip-path="url(#waveClip)"/>

  <!-- Code lines background — left column -->
  <g font-family="'Courier New', monospace" font-size="9.5" fill-opacity="0.13" clip-path="url(#waveClip)">
    <text x="18" y="22"  fill="#4a9eff">const</text><text x="52" y="22"  fill="#e2e8f0"> developer = {</text>
    <text x="26" y="37"  fill="#ffd700">  nombre:</text><text x="80" y="37"  fill="#68d391"> "Daniel Felipe Moreno",</text>
    <text x="26" y="52"  fill="#ffd700">  rol:</text><text x="60" y="52"  fill="#68d391"> "Full-Stack Developer",</text>
    <text x="26" y="67"  fill="#ffd700">  stack:</text><text x="68" y="67"  fill="#4a9eff"> ["React", "Node.js", "PostgreSQL"],</text>
    <text x="26" y="82"  fill="#ffd700">  deploy:</text><text x="72" y="82"  fill="#68d391"> ["Railway", "Vercel"],</text>
    <text x="26" y="97"  fill="#ffd700">  semestre:</text><text x="88" y="97"  fill="#f6ad55"> 8,</text>
    <text x="26" y="112" fill="#ffd700">  ciudad:</text><text x="74" y="112" fill="#68d391"> "Bogotá, Colombia 🇨🇴",</text>
    <text x="26" y="127" fill="#ffd700">  pasion:</text><text x="74" y="127" fill="#68d391"> "UX + Software + Negocios",</text>
    <text x="18" y="142" fill="#e2e8f0">};</text>
    <text x="18" y="160" fill="#4a9eff">function</text><text x="64" y="160" fill="#e8d44d"> build</text><text x="90" y="160" fill="#e2e8f0">(idea) {</text>
    <text x="26" y="175" fill="#4a9eff">  return</text><text x="64" y="175" fill="#68d391"> idea.makeItReal();</text>
    <text x="18" y="190" fill="#e2e8f0">}</text>
  </g>

  <!-- Code lines background — right column -->
  <g font-family="'Courier New', monospace" font-size="9.5" fill-opacity="0.11" clip-path="url(#waveClip)">
    <text x="580" y="20"  fill="#4a9eff">import</text><text x="616" y="20"  fill="#e2e8f0"> React </text><text x="648" y="20" fill="#4a9eff">from</text><text x="674" y="20" fill="#68d391"> 'react';</text>
    <text x="580" y="36"  fill="#4a9eff">import</text><text x="616" y="36"  fill="#e2e8f0"> express </text><text x="656" y="36" fill="#4a9eff">from</text><text x="682" y="36" fill="#68d391"> 'express';</text>
    <text x="580" y="52"  fill="#4a9eff">import</text><text x="616" y="52"  fill="#e2e8f0"> { Pool } </text><text x="656" y="52" fill="#4a9eff">from</text><text x="682" y="52" fill="#68d391"> 'pg';</text>
    <text x="580" y="70"  fill="#e2e8f0">const app = </text><text x="636" y="70" fill="#4a9eff">new</text><text x="657" y="70" fill="#e8d44d"> Express();</text>
    <text x="580" y="86"  fill="#4a9eff">const</text><text x="610" y="86"  fill="#e2e8f0"> db = </text><text x="635" y="86" fill="#4a9eff">new</text><text x="655" y="86" fill="#e8d44d"> Pool({</text>
    <text x="588" y="101" fill="#ffd700">  host:</text><text x="614" y="101" fill="#68d391"> 'railway.app',</text>
    <text x="588" y="116" fill="#ffd700">  ssl:</text><text x="612" y="116"  fill="#f6ad55"> true</text>
    <text x="580" y="131" fill="#e2e8f0">});</text>
    <text x="580" y="149" fill="#4a9eff">app</text><text x="598" y="149" fill="#e2e8f0">.listen(3000, () =></text>
    <text x="588" y="164" fill="#e2e8f0">  console.</text><text x="633" y="164" fill="#e8d44d">log</text><text x="651" y="164" fill="#e2e8f0">(</text><text x="656" y="164" fill="#68d391">'🚀 Running'</text><text x="718" y="164" fill="#e2e8f0">)</text>
    <text x="580" y="179" fill="#e2e8f0">);</text>
  </g>

  <!-- Fade overlays to blend code into bg smoothly -->
  <rect width="900" height="200" fill="url(#codeFade)"  clip-path="url(#waveClip)"/>
  <rect width="900" height="200" fill="url(#codeFadeV)" clip-path="url(#waveClip)"/>

  <!-- Center glow blob -->
  <ellipse cx="450" cy="100" rx="280" ry="90" fill="url(#glowBg)"/>

  <!-- Gold horizontal accent lines -->
  <line x1="180" y1="68" x2="340" y2="68" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.5"/>
  <line x1="560" y1="68" x2="720" y2="68" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.5"/>
  <line x1="180" y1="130" x2="340" y2="130" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.5"/>
  <line x1="560" y1="130" x2="720" y2="130" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.5"/>

  <!-- Gold corner diamonds -->
  <g fill="url(#goldGrad)" opacity="0.7" filter="url(#glow)">
    <polygon points="170,68 176,62 182,68 176,74" />
    <polygon points="718,68 724,62 730,68 724,74" />
    <polygon points="170,130 176,124 182,130 176,136" />
    <polygon points="718,130 724,124 730,130 724,136" />
  </g>

  <!-- Small gold dots scattered -->
  <g fill="#ffd700" opacity="0.35">
    <circle cx="155" cy="68"  r="1.5"/>
    <circle cx="145" cy="68"  r="1"/>
    <circle cx="745" cy="68"  r="1.5"/>
    <circle cx="755" cy="68"  r="1"/>
    <circle cx="155" cy="130" r="1.5"/>
    <circle cx="145" cy="130" r="1"/>
    <circle cx="745" cy="130" r="1.5"/>
    <circle cx="755" cy="130" r="1"/>
  </g>

  <!-- Name shadow/glow layer -->
  <text x="450" y="103" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-size="34" letter-spacing="1.5"
        fill="#c9a84c" opacity="0.25" filter="url(#softGlow)">
    Daniel Felipe Moreno Nuñez
  </text>

  <!-- Name main text -->
  <text x="450" y="100" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-size="34" letter-spacing="1.5"
        fill="url(#goldText)" filter="url(#glow)">
    Daniel Felipe Moreno Nuñez
  </text>

  <!-- Subtitle -->
  <text x="450" y="124" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-weight="400" font-size="13.5" letter-spacing="3.5"
        fill="#a8c0e0" opacity="0.9">
    FULL-STACK DEVELOPER  ·  SYSTEMS ENGINEERING STUDENT
  </text>

  <!-- Bottom wave shape -->
  <path d="M0,180 Q225,165 450,180 Q675,195 900,180 L900,200 L0,200 Z" fill="#0d1117"/>

  <!-- Gold shimmer line at top -->
  <rect x="0" y="0" width="900" height="2.5" fill="url(#goldGrad)" opacity="0.6"/>
</svg>
